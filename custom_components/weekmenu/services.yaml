import_plan:
  name: Weekvoorstel importeren
  description: Vervangt het weekvoorstel (recepten, producten, eventueel keuze voor Michelle). Wordt door Claude op vrijdag aangeroepen.
  fields:
    plan:
      name: Plan
      description: Object met week, delivery, order_deadline, advice, recipes[], items[], michelle.
      required: true
      selector:
        object:
    standard_items:
      name: Standaardlijst
      description: Optioneel; vervangt de vaste lijst.
      selector:
        object:
get_context:
  name: Context ophalen
  description: Geeft alle Weekmenu-gegevens terug (voorkeuren, standaardlijst, feedback, huidig plan).
approve:
  name: Akkoord en mandje vullen
  description: Zet alle producten die niet zijn weggehaald in het Picnic-mandje.
add_text:
  name: Producten toevoegen
  description: Voegt producten toe aan deze week, bijv. "hagelslag, 2x komkommer".
  fields:
    text:
      name: Tekst
      required: true
      selector:
        text:
michelle_choose:
  name: Keuze Michelle
  description: Kiest Michelles meeneem-optie voor haar late dienst.
  fields:
    option_id:
      name: Optie
      selector:
        text:
set_preferences:
  name: Voorkeuren
  description: Werkt voorkeuren bij (worden samengevoegd).
  fields:
    preferences:
      name: Voorkeuren
      required: true
      selector:
        object:
answer:
  name: Vraag beantwoorden
  description: Beantwoordt een weekvraag (bijv. snack voor Kai). Kies een optie of typ zelf iets; wat gekozen wordt, wordt onthouden.
  fields:
    question_id:
      name: Vraag
      required: true
      selector:
        text:
    option_id:
      name: Optie
      selector:
        text:
    text:
      name: Zelf getypt
      selector:
        text:
choose_day:
  name: Dag kiezen
  description: Kiest voor een dag (ma–vr) een recept uit de opties, of "none" (niets koken), of leeg (nog kiezen). Alleen ingrediënten van gekozen recepten gaan mee in de boodschappen.
  fields:
    day:
      name: Dag
      description: ma, di, wo, do of vr
      required: true
      selector:
        text:
    choice:
      name: Keuze
      description: Recept-id (bijv. r2), "none" voor niets koken, of leeg om de keuze ongedaan te maken.
      selector:
        text:

add_options:
  name: Opties toevoegen aan een dag
  description: >-
    Voegt nieuwe receptopties toe aan één dag (voor de tegel "Andere gerechten").
    Keuzes en lijst blijven staan. Recept-ids worden opnieuw genummerd; items koppelen via recipe_id.
  fields:
    day:
      name: Dag
      required: true
      example: di
      selector:
        text:
    recipes:
      name: Recepten
      description: Zelfde formaat als recipes in import_plan.
      required: true
      selector:
        object:
    items:
      name: Ingrediënten
      description: Recept-items met recipe_id van een recept hierboven (zelfde formaat als items in import_plan).
      selector:
        object:
    week:
      name: Week
      description: Ter controle, bijv. 2026-W48.
      selector:
        text:
